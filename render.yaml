services:
  - type: web
    name: casebridge-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENV
        value: prod
      - key: ALLOW_DEMO_LOGIN
        value: "false"
      - key: CORS_ORIGINS
        sync: false
      - key: JWT_SECRET
        generateValue: true
