services:
  - type: web
    name: casebridge-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python ../scripts/import_csv.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENV
        value: prod
      - key: ALLOW_DEMO_LOGIN
        value: "false"
      # Auto-seed demo data on startup if cases table is empty.
      # Note: ALLOW_DEMO_LOGIN=true is needed for the one-click demo accounts.
      - key: AUTO_SEED
        value: "true"
      - key: CORS_ORIGINS
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Email notifications (CaseBridge Demo)
      # Render Free blocks outbound SMTP ports 25, 465, and 587; 'resend' HTTPS adapter is the supported route.
      - key: EMAIL_BACKEND
        value: "resend"
      - key: EMAIL_FROM_EMAIL
        sync: false
      - key: EMAIL_FROM_NAME
        value: "CaseBridge Demo"
      - key: RESEND_API_KEY
        sync: false
      # Optional SMTP configuration (if deployed on hosting with open SMTP ports)
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_TLS
        value: "true"
      - key: SMTP_SSL
        value: "false"
