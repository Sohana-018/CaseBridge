services:
  - type: web
    name: casebridge-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python ../scripts/import_csv.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENV
        value: prod
      - key: ALLOW_DEMO_LOGIN
        value: "false"
      # Auto-seed demo data on startup if cases table is empty.
      # Note: ALLOW_DEMO_LOGIN=true is needed for the one-click demo accounts.
      - key: AUTO_SEED
        value: "true"
      - key: CORS_ORIGINS
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Email notifications (SMTP)
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_FROM_NAME
        value: "CaseBridge Grievance Portal"
      - key: SMTP_TLS
        value: "true"
      - key: SMTP_SSL
        value: "false"
      - key: FRONTEND_URL
        sync: false
